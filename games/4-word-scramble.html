<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Word Scramble</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0510; color: #fff; font-family: 'Segoe UI', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
  h1 { font-size: 1.8rem; background: linear-gradient(135deg, #ec4899, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 12px; }
  .hud { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; justify-content: center; }
  .stat { background: #100818; border: 1px solid #2d1f3a; border-radius: 10px; padding: 8px 16px; text-align: center; min-width: 80px; }
  .stat-label { font-size: 0.62rem; color: #6b7280; text-transform: uppercase; letter-spacing: 1px; }
  .stat-val { font-size: 1.2rem; font-weight: 700; color: #ec4899; }
  .category-tag { background: #2d1f3a; border: 1px solid #4c1d95; color: #c4b5fd; border-radius: 20px; padding: 4px 14px; font-size: 0.8rem; margin-bottom: 16px; }
  .scrambled { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 20px; min-height: 60px; }
  .letter-tile { background: linear-gradient(135deg, #2d1f3a, #1e1b4b); border: 2px solid #4c1d95; border-radius: 10px; width: 48px; height: 56px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 700; cursor: pointer; transition: all .2s; user-select: none; color: #e9d5ff; }
  .letter-tile:hover { transform: translateY(-4px); background: linear-gradient(135deg, #4c1d95, #3730a3); border-color: #a78bfa; }
  .letter-tile.selected { transform: translateY(-4px) scale(1.1); background: linear-gradient(135deg, #7c3aed, #4f46e5); border-color: #a78bfa; box-shadow: 0 8px 20px rgba(124,58,237,0.4); }
  .letter-tile.used { opacity: 0.2; pointer-events: none; }
  .answer-zone { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 20px; min-height: 60px; }
  .answer-slot { border: 2px dashed #4c1d95; border-radius: 10px; width: 48px; height: 56px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: 700; color: #e9d5ff; cursor: pointer; transition: all .2s; }
  .answer-slot.filled { background: linear-gradient(135deg, #1e1b4b, #2d1f3a); border-color: #a78bfa; border-style: solid; }
  .answer-slot.correct { background: linear-gradient(135deg, #064e3b, #065f46); border-color: #34d399; border-style: solid; color: #ecfdf5; }
  .answer-slot.wrong { background: linear-gradient(135deg, #7f1d1d, #991b1b); border-color: #ef4444; animation: shake .4s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  .hint-text { background: #100818; border: 1px solid #2d1f3a; border-radius: 10px; padding: 12px 20px; color: #9ca3af; font-size: 0.9rem; margin-bottom: 16px; min-height: 48px; text-align: center; max-width: 340px; }
  .btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .btn { border: none; color: #fff; border-radius: 10px; padding: 10px 20px; cursor: pointer; font-size: 0.85rem; font-weight: 600; transition: all .2s; }
  .btn-check { background: linear-gradient(135deg, #7c3aed, #4f46e5); }
  .btn-hint { background: linear-gradient(135deg, #b45309, #d97706); }
  .btn-skip { background: #1f2937; }
  .btn:hover { transform: translateY(-2px); }
  .win-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; align-items: center; justify-content: center; z-index: 100; }
  .win-overlay.show { display: flex; }
  .win-box { background: #100818; border: 2px solid #ec4899; border-radius: 20px; padding: 36px; text-align: center; animation: popIn .5s ease; max-width: 320px; }
  @keyframes popIn { from{transform:scale(0.5);opacity:0} to{transform:scale(1);opacity:1} }
  .win-emoji { font-size: 3.5rem; display: block; margin-bottom: 12px; }
  .win-title { font-size: 1.8rem; background: linear-gradient(135deg, #ec4899, #8b5cf6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
  .win-stats { color: #9ca3af; margin-bottom: 20px; }
  .word-reveal { font-size: 2rem; color: #e9d5ff; letter-spacing: 4px; margin: 12px 0; font-weight: 700; animation: reveal .5s ease; }
  @keyframes reveal { from{letter-spacing:12px;opacity:0} to{letter-spacing:4px;opacity:1} }
  .progress { display: flex; gap: 4px; justify-content: center; margin-bottom: 14px; }
  .prog-dot { width: 10px; height: 10px; border-radius: 50%; background: #2d1f3a; }
  .prog-dot.done { background: #ec4899; }
  .prog-dot.current { background: #8b5cf6; box-shadow: 0 0 8px #8b5cf6; }
</style>
</head>
<body>
<h1>📝 Word Scramble</h1>
<div class="hud">
  <div class="stat"><div class="stat-label">Score</div><div class="stat-val" id="score">0</div></div>
  <div class="stat"><div class="stat-label">Word</div><div class="stat-val" id="wordNum">1/10</div></div>
  <div class="stat"><div class="stat-label">Time</div><div class="stat-val" id="timer">0:00</div></div>
  <div class="stat"><div class="stat-label">Hints</div><div class="stat-val" id="hints">3</div></div>
</div>
<div class="progress" id="progress"></div>
<div class="category-tag" id="categoryTag">🌍 Animals</div>
<div class="scrambled" id="scrambled"></div>
<div class="answer-zone" id="answerZone"></div>
<div class="hint-text" id="hintText">Click letters above to spell the word!</div>
<div class="btns">
  <button class="btn btn-check" onclick="checkAnswer()">✓ Check</button>
  <button class="btn btn-hint" onclick="useHint()">💡 Hint</button>
  <button class="btn btn-skip" onclick="skipWord()">⏭ Skip</button>
</div>

<div class="win-overlay" id="winOverlay">
  <div class="win-box">
    <span class="win-emoji">🏅</span>
    <div class="win-title">Complete!</div>
    <div class="win-stats" id="winStats"></div>
    <button class="btn btn-check" onclick="startGame()">Play Again</button>
  </div>
</div>

<script>
const WORDS = [
  {word:'ELEPHANT',hint:'Largest land animal',cat:'🦁 Animals'},
  {word:'GUITAR',hint:'Stringed musical instrument',cat:'🎵 Music'},
  {word:'PYRAMID',hint:'Ancient Egyptian structure',cat:'🌍 Places'},
  {word:'OXYGEN',hint:'We breathe this',cat:'🔬 Science'},
  {word:'DOLPHIN',hint:'Smart ocean mammal',cat:'🦁 Animals'},
  {word:'RAINBOW',hint:'After the rain appears',cat:'🌈 Nature'},
  {word:'VOLCANO',hint:'Mountain that erupts',cat:'🌍 Places'},
  {word:'LANTERN',hint:'Portable light source',cat:'✨ Objects'},
  {word:'JUPITER',hint:'Largest planet',cat:'🔬 Science'},
  {word:'PENGUIN',hint:'Tuxedo bird that swims',cat:'🦁 Animals'},
  {word:'CRYSTAL',hint:'Clear mineral rock',cat:'✨ Objects'},
  {word:'TRUMPET',hint:'Brass wind instrument',cat:'🎵 Music'},
  {word:'BLANKET',hint:'Keeps you warm in bed',cat:'✨ Objects'},
  {word:'CAPTAIN',hint:'Leader of a ship',cat:'👤 People'},
  {word:'KITCHEN',hint:'Room for cooking',cat:'🏠 Home'},
];
let wordList, current, answer, hintsLeft, score, timer, seconds, wordIndex, hintUsed;

function startGame() {
  wordList = shuffle([...WORDS]).slice(0, 10);
  wordIndex = 0; score = 0; seconds = 0; hintsLeft = 3;
  document.getElementById('score').textContent = '0';
  document.getElementById('hints').textContent = '3';
  document.getElementById('winOverlay').classList.remove('show');
  clearInterval(timer);
  timer = setInterval(() => {
    seconds++;
    const m = Math.floor(seconds/60), s = seconds%60;
    document.getElementById('timer').textContent = `${m}:${s.toString().padStart(2,'0')}`;
  }, 1000);
  buildProgress();
  loadWord();
}

function buildProgress() {
  const p = document.getElementById('progress');
  p.innerHTML = '';
  wordList.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'prog-dot' + (i === wordIndex ? ' current' : '');
    p.appendChild(d);
  });
}

function loadWord() {
  if (wordIndex >= wordList.length) { endGame(); return; }
  current = wordList[wordIndex];
  answer = [];
  hintUsed = false;
  document.getElementById('wordNum').textContent = `${wordIndex+1}/${wordList.length}`;
  document.getElementById('categoryTag').textContent = current.cat;
  document.getElementById('hintText').textContent = 'Click letters above to spell the word!';
  buildProgress();
  const letters = shuffle([...current.word]);
  const scrambledDiv = document.getElementById('scrambled');
  scrambledDiv.innerHTML = '';
  letters.forEach((l, i) => {
    const tile = document.createElement('div');
    tile.className = 'letter-tile';
    tile.textContent = l;
    tile.dataset.idx = i;
    tile.dataset.letter = l;
    tile.addEventListener('click', () => selectLetter(tile));
    scrambledDiv.appendChild(tile);
  });
  const answerZone = document.getElementById('answerZone');
  answerZone.innerHTML = '';
  for (let i = 0; i < current.word.length; i++) {
    const slot = document.createElement('div');
    slot.className = 'answer-slot';
    slot.dataset.pos = i;
    slot.addEventListener('click', () => removeLetter(i));
    answerZone.appendChild(slot);
  }
}

function selectLetter(tile) {
  if (tile.classList.contains('used')) return;
  const pos = answer.length;
  if (pos >= current.word.length) return;
  answer.push({letter: tile.dataset.letter, tileIdx: tile.dataset.idx});
  tile.classList.add('used');
  const slot = document.querySelector(`.answer-slot[data-pos="${pos}"]`);
  slot.textContent = tile.dataset.letter;
  slot.classList.add('filled');
  slot.dataset.tileIdx = tile.dataset.idx;
}

function removeLetter(pos) {
  if (pos >= answer.length) return;
  const removed = answer.splice(pos);
  for (let i = pos; i < pos + removed.length; i++) {
    const slot = document.querySelector(`.answer-slot[data-pos="${i}"]`);
    slot.textContent = '';
    slot.classList.remove('filled', 'correct', 'wrong');
    delete slot.dataset.tileIdx;
  }
  removed.forEach(r => {
    const tile = document.querySelector(`.letter-tile[data-idx="${r.tileIdx}"]`);
    if (tile) tile.classList.remove('used');
  });
}

function checkAnswer() {
  if (answer.length !== current.word.length) return;
  const typed = answer.map(a => a.letter).join('');
  const slots = document.querySelectorAll('.answer-slot');
  if (typed === current.word) {
    slots.forEach(s => { s.classList.add('correct'); s.classList.remove('wrong','filled'); });
    const pts = hintUsed ? 5 : 10;
    score += pts;
    document.getElementById('score').textContent = score;
    document.getElementById('hintText').textContent = `✅ Correct! +${pts} points`;
    setTimeout(() => { wordIndex++; loadWord(); }, 1000);
  } else {
    slots.forEach(s => { if (s.classList.contains('filled')) { s.classList.add('wrong'); } });
    document.getElementById('hintText').textContent = '❌ Not quite — try again!';
    setTimeout(() => {
      slots.forEach(s => s.classList.remove('wrong'));
      answer = [];
      document.querySelectorAll('.answer-slot').forEach(s => { s.textContent=''; s.classList.remove('filled','correct','wrong'); });
      document.querySelectorAll('.letter-tile').forEach(t => t.classList.remove('used'));
    }, 800);
  }
}

function useHint() {
  if (hintsLeft <= 0) { document.getElementById('hintText').textContent = 'No hints left!'; return; }
  hintsLeft--;
  hintUsed = true;
  document.getElementById('hints').textContent = hintsLeft;
  document.getElementById('hintText').textContent = `💡 ${current.hint}`;
}

function skipWord() {
  document.getElementById('hintText').textContent = `Answer: ${current.word}`;
  setTimeout(() => { wordIndex++; loadWord(); }, 1200);
}

function endGame() {
  clearInterval(timer);
  const m = Math.floor(seconds/60), s = seconds%60;
  document.getElementById('winStats').textContent = `Score: ${score}/100 · Time: ${m}:${s.toString().padStart(2,'0')}`;
  document.getElementById('winOverlay').classList.add('show');
}

function shuffle(arr) {
  for (let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
  return arr;
}

startGame();
</script>
</body>
</html>
