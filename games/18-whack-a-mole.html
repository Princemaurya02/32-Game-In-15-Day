<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Whack-a-Mole</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0f05;color:#fff;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px;touch-action:manipulation}
h1{font-size:1.7rem;background:linear-gradient(135deg,#84cc16,#22d3ee);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.hud{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;justify-content:center}
.stat{background:#0d130a;border:1px solid #1a2e10;border-radius:10px;padding:6px 14px;text-align:center;min-width:72px}
.stat-label{font-size:.6rem;color:#6b7280;text-transform:uppercase;letter-spacing:1px}
.stat-val{font-size:1.05rem;font-weight:700;color:#84cc16}
.timer-bar{width:300px;max-width:90vw;height:10px;background:#1a2e10;border-radius:5px;margin-bottom:12px;overflow:hidden}
.timer-fill{height:100%;background:linear-gradient(90deg,#22c55e,#84cc16);border-radius:5px;transition:width .1s linear}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:340px;width:100%;margin-bottom:14px}
.hole{position:relative;aspect-ratio:1;cursor:pointer;border-radius:50%;overflow:hidden;background:radial-gradient(ellipse at 50% 70%,#1a3010,#0d130a);border:3px solid #1a2e10;display:flex;align-items:flex-end;justify-content:center;transition:transform .1s}
.hole:active{transform:scale(.94)}
.hole-inner{width:85%;height:85%;border-radius:50%;background:radial-gradient(ellipse at 40% 35%,#111,#050a03);position:absolute;bottom:0}
.mole{position:absolute;bottom:0;width:80%;text-align:center;font-size:2.4rem;transform:translateY(110%);transition:transform .12s cubic-bezier(.175,.885,.32,1.275);line-height:1;pointer-events:none;z-index:2}
.mole.up{transform:translateY(15%)}
.mole.whacked{transform:translateY(15%) scale(1.3);filter:hue-rotate(180deg)}
.score-pop{position:absolute;top:10%;left:50%;transform:translateX(-50%);font-size:1.2rem;font-weight:800;color:#fde68a;opacity:0;pointer-events:none;z-index:5;transition:none}
.score-pop.show{animation:floatUp .7s ease forwards}
@keyframes floatUp{0%{opacity:1;transform:translateX(-50%) translateY(0)}100%{opacity:0;transform:translateX(-50%) translateY(-40px)}}
.diff-bar{display:flex;gap:6px;margin-bottom:10px}
.diff-btn{background:#0d130a;border:1px solid #1a2e10;color:#9ca3af;border-radius:8px;padding:5px 12px;cursor:pointer;font-size:.75rem;transition:all .2s}
.diff-btn.active{background:#14532d;border-color:#22c55e;color:#86efac}
.btn{background:linear-gradient(135deg,#14532d,#16a34a);border:none;color:#fff;border-radius:10px;padding:9px 22px;cursor:pointer;font-size:.85rem;font-weight:700;transition:all .2s}
.btn:hover{transform:translateY(-2px)}
.msg{min-height:24px;font-size:.85rem;color:#6b7280;text-align:center;margin:6px 0}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:100}
.overlay.show{display:flex}
.ov-box{background:#0d130a;border:2px solid #22c55e;border-radius:20px;padding:36px;text-align:center;animation:pop .4s ease;max-width:280px;width:90%}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.ov-emoji{font-size:3rem;display:block;margin-bottom:10px}
.ov-title{font-size:1.7rem;color:#22c55e;margin-bottom:6px}
.ov-sub{color:#9ca3af;margin-bottom:20px;font-size:.9rem}
</style>
</head>
<body>
<h1>🔨 Whack-a-Mole</h1>
<div class="hud">
  <div class="stat"><div class="stat-label">Score</div><div class="stat-val" id="score">0</div></div>
  <div class="stat"><div class="stat-label">Best</div><div class="stat-val" id="best">0</div></div>
  <div class="stat"><div class="stat-label">Combo</div><div class="stat-val" id="combo">x1</div></div>
  <div class="stat"><div class="stat-label">Misses</div><div class="stat-val" id="misses">0</div></div>
</div>
<div class="timer-bar"><div class="timer-fill" id="timerFill" style="width:100%"></div></div>
<div class="diff-bar">
  <button class="diff-btn active" onclick="setDiff(1200,800,this)">Easy</button>
  <button class="diff-btn" onclick="setDiff(900,600,this)">Normal</button>
  <button class="diff-btn" onclick="setDiff(600,400,this)">Hard</button>
  <button class="diff-btn" onclick="setDiff(400,250,this)">Insane</button>
</div>
<div class="grid" id="grid"></div>
<div class="msg" id="msg">Press Start to play!</div>
<button class="btn" id="startBtn" onclick="startGame()">▶ Start</button>
<div class="overlay" id="ov">
  <div class="ov-box">
    <span class="ov-emoji" id="ovEmoji">🏆</span>
    <div class="ov-title" id="ovTitle">Time's Up!</div>
    <div class="ov-sub" id="ovSub"></div>
    <button class="btn" onclick="startGame();closeOv()">▶ Play Again</button>
  </div>
</div>
<script>
const MOLES=['🐹','🐭','🦔','🐿️','🐾'];
const GOLDEN='⭐';
const BOMB='💣';
const GAME_TIME=30000;
let score=0,best=0,misses=0,combo=1,maxCombo=1;
let holes=[],timers=[],upIndices=new Set();
let gameTimer,timerStart,running=false;
let moleUpTime=1200,moleInterval=800;

function setDiff(up,inter,btn){
  moleUpTime=up;moleInterval=inter;
  document.querySelectorAll('.diff-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

function buildGrid(){
  const g=document.getElementById('grid');g.innerHTML='';holes=[];
  for(let i=0;i<9;i++){
    const hole=document.createElement('div');hole.className='hole';
    const inner=document.createElement('div');inner.className='hole-inner';hole.appendChild(inner);
    const mole=document.createElement('div');mole.className='mole';mole.textContent=MOLES[0];hole.appendChild(mole);
    const pop=document.createElement('div');pop.className='score-pop';hole.appendChild(pop);
    hole.addEventListener('click',()=>whack(i));
    hole.addEventListener('touchstart',e=>{e.preventDefault();whack(i);},{passive:false});
    g.appendChild(hole);holes.push({el:hole,moleEl:mole,popEl:pop,up:false,type:'mole'});
  }
}

function startGame(){
  if(running)return;
  score=0;misses=0;combo=1;maxCombo=1;running=true;
  upIndices.clear();timers.forEach(clearTimeout);timers=[];
  buildGrid();updateHUD();closeOv();
  document.getElementById('timerFill').style.width='100%';
  document.getElementById('timerFill').style.background='linear-gradient(90deg,#22c55e,#84cc16)';
  timerStart=Date.now();
  gameTimer=setInterval(()=>{
    const elapsed=Date.now()-timerStart;
    const pct=Math.max(0,100-(elapsed/GAME_TIME)*100);
    document.getElementById('timerFill').style.width=pct+'%';
    if(pct<30)document.getElementById('timerFill').style.background='linear-gradient(90deg,#ef4444,#f97316)';
    else if(pct<60)document.getElementById('timerFill').style.background='linear-gradient(90deg,#f59e0b,#84cc16)';
    if(elapsed>=GAME_TIME)endGame();
  },100);
  spawnLoop();
  setMsg('Whack the moles! 🔨');
}

function spawnLoop(){
  if(!running)return;
  const avail=holes.map((_,i)=>i).filter(i=>!upIndices.has(i));
  if(avail.length){
    const idx=avail[Math.floor(Math.random()*avail.length)];
    const isGolden=Math.random()<.12;
    const isBomb=Math.random()<.08;
    const type=isGolden?'golden':isBomb?'bomb':'mole';
    upMole(idx,type);
    const t=setTimeout(()=>downMole(idx,true),moleUpTime+(isGolden?300:0));
    timers.push(t);
  }
  const delay=moleInterval+Math.random()*300;
  const t=setTimeout(spawnLoop,delay);timers.push(t);
}

function upMole(idx,type){
  const h=holes[idx];h.up=true;h.type=type;upIndices.add(idx);
  h.moleEl.textContent=type==='golden'?GOLDEN:type==='bomb'?BOMB:MOLES[Math.floor(Math.random()*MOLES.length)];
  h.moleEl.classList.add('up');
}

function downMole(idx,missed){
  const h=holes[idx];if(!h.up)return;
  h.up=false;upIndices.delete(idx);
  h.moleEl.classList.remove('up','whacked');
  if(missed&&h.type!=='bomb'){misses++;combo=1;document.getElementById('combo').textContent='x1';document.getElementById('misses').textContent=misses;updateHUD();}
}

function whack(idx){
  if(!running)return;
  const h=holes[idx];if(!h.up)return;
  h.moleEl.classList.add('whacked');
  let pts=0;
  if(h.type==='bomb'){score=Math.max(0,score-50);combo=1;showPop(idx,'-50','#ef4444');}
  else if(h.type==='golden'){pts=50*combo;score+=pts;combo++;showPop(idx,`+${pts}⭐`,'#fde68a');}
  else{pts=10*combo;score+=pts;combo++;showPop(idx,`+${pts}`,'#86efac');}
  maxCombo=Math.max(maxCombo,combo);
  if(score>best)best=score;
  updateHUD();
  setTimeout(()=>downMole(idx,false),100);
}

function showPop(idx,text,color){
  const p=holes[idx].popEl;p.textContent=text;p.style.color=color;
  p.classList.remove('show');void p.offsetWidth;p.classList.add('show');
}

function updateHUD(){
  document.getElementById('score').textContent=score;
  document.getElementById('best').textContent=best;
  document.getElementById('combo').textContent=`x${combo}`;
  document.getElementById('misses').textContent=misses;
}

function endGame(){
  running=false;clearInterval(gameTimer);timers.forEach(clearTimeout);
  holes.forEach((_,i)=>downMole(i,false));
  const grade=score>=500?'S':score>=300?'A':score>=150?'B':score>=80?'C':'D';
  document.getElementById('ovEmoji').textContent=score>=300?'🏆':score>=100?'🎉':'😤';
  document.getElementById('ovTitle').textContent=`Grade ${grade}`;
  document.getElementById('ovSub').textContent=`Score: ${score} · Max combo: x${maxCombo} · Misses: ${misses}`;
  document.getElementById('ov').classList.add('show');
}

function setMsg(m){document.getElementById('msg').textContent=m;}
function closeOv(){document.getElementById('ov').classList.remove('show');}

buildGrid();
</script>
</body>
</html>
