<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Number Slide Puzzle</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a0f; color: #fff; font-family: 'Segoe UI', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
  h1 { font-size: 1.8rem; background: linear-gradient(135deg, #34d399, #06b6d4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 12px; }
  .hud { display: flex; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; justify-content: center; }
  .stat { background: #111827; border: 1px solid #1f2937; border-radius: 10px; padding: 8px 16px; text-align: center; min-width: 80px; }
  .stat-label { font-size: 0.65rem; color: #6b7280; text-transform: uppercase; letter-spacing: 1px; }
  .stat-val { font-size: 1.2rem; font-weight: 700; color: #34d399; }
  .level-bar { display: flex; gap: 8px; margin-bottom: 16px; }
  .level-btn { background: #111827; border: 1px solid #1f2937; color: #9ca3af; border-radius: 8px; padding: 6px 14px; cursor: pointer; font-size: 0.8rem; transition: all .2s; }
  .level-btn.active { background: #065f46; border-color: #34d399; color: #34d399; }
  .board { display: grid; gap: 6px; padding: 12px; background: #111827; border-radius: 16px; border: 1px solid #1f2937; }
  .tile { display: flex; align-items: center; justify-content: center; border-radius: 10px; font-weight: 700; cursor: pointer; transition: transform 0.15s cubic-bezier(.175,.885,.32,1.275), background .2s; user-select: none; position: relative; }
  .tile:not(.empty):hover { transform: scale(1.05); }
  .tile.empty { background: #0a0a0f; border: 2px dashed #1f2937; cursor: default; }
  .tile.correct { background: linear-gradient(135deg, #065f46, #047857); border: 2px solid #34d399; color: #ecfdf5; box-shadow: 0 0 12px rgba(52,211,153,0.3); }
  .tile:not(.empty):not(.correct) { background: linear-gradient(135deg, #1e3a5f, #1e4070); border: 2px solid #2563eb; color: #bfdbfe; }
  .tile.slide { animation: slide 0.15s ease-out; }
  @keyframes slide { 0%{opacity:.6} 100%{opacity:1} }
  .btn { background: linear-gradient(135deg, #065f46, #047857); border: none; color: #ecfdf5; border-radius: 10px; padding: 10px 24px; cursor: pointer; font-size: 0.9rem; font-weight: 600; transition: all .2s; margin-top: 14px; }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(52,211,153,0.3); }
  .win-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
  .win-overlay.show { display: flex; }
  .win-box { background: #111827; border: 2px solid #34d399; border-radius: 20px; padding: 40px; text-align: center; animation: popIn .5s ease; }
  @keyframes popIn { from{transform:scale(0.5);opacity:0} to{transform:scale(1);opacity:1} }
  .win-emoji { font-size: 4rem; display: block; margin-bottom: 16px; }
  .win-title { font-size: 2rem; background: linear-gradient(135deg, #34d399, #06b6d4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
  .win-stats { color: #9ca3af; margin-bottom: 24px; }
  .preview { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: #6b7280; margin-bottom: 12px; }
</style>
</head>
<body>
<h1>🔢 Slide Puzzle</h1>
<div class="hud">
  <div class="stat"><div class="stat-label">Moves</div><div class="stat-val" id="moves">0</div></div>
  <div class="stat"><div class="stat-label">Time</div><div class="stat-val" id="timer">0:00</div></div>
  <div class="stat"><div class="stat-label">Best</div><div class="stat-val" id="best">—</div></div>
</div>
<div class="level-bar">
  <button class="level-btn active" onclick="initGame(3)">3×3</button>
  <button class="level-btn" onclick="initGame(4)">4×4</button>
  <button class="level-btn" onclick="initGame(5)">5×5</button>
</div>
<div class="board" id="board"></div>
<button class="btn" onclick="initGame(currentSize)">🔄 Shuffle</button>

<div class="win-overlay" id="winOverlay">
  <div class="win-box">
    <span class="win-emoji">🏆</span>
    <div class="win-title">Solved!</div>
    <div class="win-stats" id="winStats"></div>
    <button class="btn" onclick="nextSize()">Harder →</button>
    <br>
    <button class="btn" style="background:#1f2937;margin-top:8px" onclick="closeWin()">Play Again</button>
  </div>
</div>

<script>
let tiles = [], empty = 0, moves = 0, seconds = 0, timer = null, currentSize = 3, started = false;
const bests = {};

function initGame(size) {
  currentSize = size;
  document.querySelectorAll('.level-btn').forEach((b, i) => b.classList.toggle('active', [3,4,5][i] === size));
  clearInterval(timer);
  moves = 0; seconds = 0; started = false;
  document.getElementById('moves').textContent = '0';
  document.getElementById('timer').textContent = '0:00';
  document.getElementById('best').textContent = bests[size] ? formatTime(bests[size]) : '—';
  tiles = Array.from({length: size*size}, (_, i) => i);
  do { shuffle(tiles); } while (!isSolvable(tiles, size));
  empty = tiles.indexOf(0);
  render(size);
  document.getElementById('winOverlay').classList.remove('show');
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

function isSolvable(arr, n) {
  let inv = 0;
  const nums = arr.filter(x => x !== 0);
  for (let i = 0; i < nums.length; i++)
    for (let j = i + 1; j < nums.length; j++)
      if (nums[i] > nums[j]) inv++;
  if (n % 2 === 1) return inv % 2 === 0;
  const row = Math.floor(arr.indexOf(0) / n);
  return (inv + row) % 2 === 1;
}

function render(size) {
  const board = document.getElementById('board');
  const tileSize = Math.min(72, Math.floor((Math.min(window.innerWidth - 60, 380)) / size));
  board.style.gridTemplateColumns = `repeat(${size}, ${tileSize}px)`;
  board.innerHTML = '';
  tiles.forEach((val, idx) => {
    const tile = document.createElement('div');
    tile.className = 'tile' + (val === 0 ? ' empty' : (val === idx + 1 || (val === size*size-1 && idx === size*size-1) ? ' correct' : ''));
    tile.style.width = tile.style.height = tileSize + 'px';
    tile.style.fontSize = tileSize > 60 ? '1.4rem' : '1rem';
    if (val !== 0) tile.textContent = val;
    if (val !== 0) tile.addEventListener('click', () => moveTile(idx, size));
    board.appendChild(tile);
  });
}

function moveTile(idx, size) {
  const row = Math.floor(idx / size), col = idx % size;
  const eRow = Math.floor(empty / size), eCol = empty % size;
  if (Math.abs(row - eRow) + Math.abs(col - eCol) !== 1) return;
  if (!started) {
    started = true;
    timer = setInterval(() => {
      seconds++;
      document.getElementById('timer').textContent = formatTime(seconds);
    }, 1000);
  }
  tiles[empty] = tiles[idx];
  tiles[idx] = 0;
  empty = idx;
  moves++;
  document.getElementById('moves').textContent = moves;
  render(size);
  if (isWon(size)) {
    clearInterval(timer);
    if (!bests[size] || seconds < bests[size]) bests[size] = seconds;
    setTimeout(() => {
      document.getElementById('winStats').textContent = `${moves} moves · ${formatTime(seconds)}`;
      document.getElementById('winOverlay').classList.add('show');
    }, 300);
  }
}

function isWon(size) {
  for (let i = 0; i < size*size-1; i++) if (tiles[i] !== i+1) return false;
  return tiles[size*size-1] === 0;
}

function formatTime(s) {
  return `${Math.floor(s/60)}:${(s%60).toString().padStart(2,'0')}`;
}

function nextSize() {
  const sizes = [3,4,5];
  const next = sizes[Math.min(sizes.indexOf(currentSize)+1, 2)];
  initGame(next);
}

function closeWin() {
  document.getElementById('winOverlay').classList.remove('show');
  initGame(currentSize);
}

document.addEventListener('keydown', e => {
  const dirs = { ArrowUp: currentSize, ArrowDown: -currentSize, ArrowLeft: 1, ArrowRight: -1 };
  const offset = dirs[e.key];
  if (offset !== undefined) {
    const target = empty + offset;
    if (target >= 0 && target < tiles.length) moveTile(target, currentSize);
    e.preventDefault();
  }
});

initGame(3);
</script>
</body>
</html>
