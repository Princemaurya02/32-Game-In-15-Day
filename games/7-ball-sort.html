<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Ball Sort</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#070b14;color:#fff;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px;touch-action:manipulation}
h1{font-size:1.7rem;background:linear-gradient(135deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px;letter-spacing:1px}
.hud{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;justify-content:center}
.stat{background:#0f1729;border:1px solid #1e2d4a;border-radius:10px;padding:6px 14px;text-align:center;min-width:72px}
.stat-label{font-size:.6rem;color:#6b7280;text-transform:uppercase;letter-spacing:1px}
.stat-val{font-size:1.05rem;font-weight:700;color:#38bdf8}
.level-nav{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.nav-btn{background:#0f1729;border:1px solid #1e2d4a;color:#9ca3af;border-radius:8px;width:34px;height:34px;cursor:pointer;font-size:1rem;transition:all .2s;display:flex;align-items:center;justify-content:center}
.nav-btn:hover{background:#1e2d4a;color:#fff}
.level-display{background:#0f1729;border:1px solid #1e2d4a;border-radius:10px;padding:4px 16px;font-size:.9rem;color:#38bdf8;font-weight:700;min-width:90px;text-align:center}
.game-area{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:480px;width:100%;margin-bottom:14px;min-height:200px;align-items:flex-end}
.tube-wrap{display:flex;flex-direction:column;align-items:center;cursor:pointer;transition:transform .15s}
.tube-wrap:hover{transform:translateY(-4px)}
.tube-wrap.selected{transform:translateY(-14px)}
.tube-wrap.selected .tube{border-color:#38bdf8;box-shadow:0 0 20px rgba(56,189,248,.5)}
.tube-wrap.hint{animation:hintPulse 1s infinite}
@keyframes hintPulse{0%,100%{transform:translateY(-4px)}50%{transform:translateY(-12px)}}
.tube{position:relative;width:48px;border:2.5px solid #2a3a5a;border-top:none;border-radius:0 0 24px 24px;overflow:hidden;background:#0a1020;display:flex;flex-direction:column-reverse;transition:border-color .2s}
.tube-cap{width:48px;height:6px;background:#2a3a5a;border-radius:4px 4px 0 0;margin-bottom:0}
.ball{width:100%;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;transition:all .3s;position:relative;flex-shrink:0}
.ball::before{content:'';position:absolute;top:3px;left:6px;width:10px;height:6px;background:rgba(255,255,255,.25);border-radius:50%;transform:rotate(-30deg)}
.tube-label{font-size:.65rem;color:#4b5563;margin-top:4px}
.done-tube .tube{border-color:#22c55e!important;box-shadow:0 0 16px rgba(34,197,94,.4)}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{border:none;color:#fff;border-radius:10px;padding:8px 18px;cursor:pointer;font-size:.82rem;font-weight:600;transition:all .2s}
.btn-restart{background:linear-gradient(135deg,#1e40af,#3b82f6)}
.btn-hint{background:linear-gradient(135deg,#065f46,#10b981)}
.btn-undo{background:#1f2937}
.btn:hover{transform:translateY(-2px)}
.msg{min-height:28px;font-size:.85rem;text-align:center;color:#9ca3af;margin-bottom:8px;transition:all .3s}
.msg.success{color:#22c55e}
.msg.error{color:#ef4444}
.win-overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:100}
.win-overlay.show{display:flex}
.win-box{background:#0f1729;border:2px solid #38bdf8;border-radius:20px;padding:36px;text-align:center;animation:popIn .5s ease;max-width:300px;width:90%}
@keyframes popIn{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.win-emoji{font-size:3.5rem;display:block;margin-bottom:12px}
.win-title{font-size:1.8rem;background:linear-gradient(135deg,#38bdf8,#818cf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.win-stats{color:#9ca3af;margin-bottom:20px}
.stars{font-size:2rem;margin-bottom:8px}
.level-dots{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;max-width:300px;margin-bottom:14px}
.level-dot{width:10px;height:10px;border-radius:50%;background:#1e2d4a;cursor:pointer;transition:all .2s}
.level-dot.completed{background:#22c55e}
.level-dot.current{background:#38bdf8;box-shadow:0 0 8px #38bdf8}
.level-dot:hover{transform:scale(1.3)}
</style>
</head>
<body>
<h1>🎯 Ball Sort</h1>
<div class="hud">
  <div class="stat"><div class="stat-label">Level</div><div class="stat-val" id="levelNum">1/25</div></div>
  <div class="stat"><div class="stat-label">Moves</div><div class="stat-val" id="moves">0</div></div>
  <div class="stat"><div class="stat-label">Best</div><div class="stat-val" id="bestMoves">—</div></div>
  <div class="stat"><div class="stat-label">Hints</div><div class="stat-val" id="hintsLeft">3</div></div>
</div>
<div class="level-nav">
  <button class="nav-btn" onclick="prevLevel()">‹</button>
  <div class="level-display" id="levelDisplay">Level 1</div>
  <button class="nav-btn" onclick="nextLevel()">›</button>
</div>
<div class="level-dots" id="levelDots"></div>
<div class="msg" id="msg">Sort all balls into same-colored tubes!</div>
<div class="game-area" id="gameArea"></div>
<div class="btns">
  <button class="btn btn-restart" onclick="restartLevel()">🔄 Restart</button>
  <button class="btn btn-hint" onclick="useHint()">💡 Hint</button>
  <button class="btn btn-undo" onclick="undoMove()">↩ Undo</button>
</div>

<div class="win-overlay" id="winOverlay">
  <div class="win-box">
    <span class="win-emoji">🎉</span>
    <div class="stars" id="winStars">⭐⭐⭐</div>
    <div class="win-title">Level Complete!</div>
    <div class="win-stats" id="winStats"></div>
    <button class="btn btn-restart" onclick="nextLevel();closeWin()" style="margin:4px">Next Level →</button>
    <br>
    <button class="btn btn-undo" onclick="restartLevel();closeWin()" style="margin-top:8px">Retry</button>
  </div>
</div>

<script>
// ─── Colours ──────────────────────────────────────────────────────────────────
const COLORS=[
 {name:'red',   bg:'#ef4444',dark:'#991b1b'},
 {name:'blue',  bg:'#3b82f6',dark:'#1d4ed8'},
 {name:'green', bg:'#22c55e',dark:'#15803d'},
 {name:'yellow',bg:'#eab308',dark:'#92400e'},
 {name:'purple',bg:'#a855f7',dark:'#6b21a8'},
 {name:'orange',bg:'#f97316',dark:'#c2410c'},
 {name:'pink',  bg:'#ec4899',dark:'#9d174d'},
 {name:'teal',  bg:'#14b8a6',dark:'#0f766e'},
 {name:'lime',  bg:'#84cc16',dark:'#3f6212'},
 {name:'indigo',bg:'#6366f1',dark:'#3730a3'},
 {name:'rose',  bg:'#f43f5e',dark:'#9f1239'},
 {name:'amber', bg:'#f59e0b',dark:'#92400e'},
];

// ─── Level Definitions ────────────────────────────────────────────────────────
// Each level: {colors: number, balls: tube capacity, extras: empty tubes}
const LEVEL_CONFIGS=[
 {c:2,b:3,e:2},{c:3,b:3,e:2},{c:3,b:4,e:2},{c:4,b:4,e:2},{c:4,b:4,e:1},
 {c:5,b:4,e:2},{c:5,b:4,e:1},{c:6,b:4,e:2},{c:6,b:4,e:1},{c:7,b:4,e:2},
 {c:7,b:4,e:1},{c:8,b:4,e:2},{c:8,b:4,e:1},{c:9,b:4,e:2},{c:9,b:4,e:1},
 {c:10,b:4,e:2},{c:10,b:4,e:1},{c:11,b:4,e:2},{c:11,b:4,e:1},{c:12,b:4,e:2},
 {c:12,b:4,e:1},{c:10,b:5,e:2},{c:11,b:5,e:1},{c:12,b:5,e:2},{c:12,b:5,e:1},
];

let currentLevel=0, tubes=[], tubeSize=4, moveCount=0, hintsLeft=3, selectedTube=-1;
let history=[], bestScores={}, completed=new Set();

function generateLevel(cfg){
 const {c,b,e}=cfg;
 const allBalls=[];
 for(let ci=0;ci<c;ci++) for(let bi=0;bi<b;bi++) allBalls.push(ci);
 // Shuffle
 for(let i=allBalls.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1));
  [allBalls[i],allBalls[j]]=[allBalls[j],allBalls[i]];
 }
 // Ensure not already solved
 const ts=[];
 for(let i=0;i<c;i++) ts.push(allBalls.slice(i*b,(i+1)*b));
 for(let i=0;i<e;i++) ts.push([]);
 // Check not trivially solved
 let solved=true;
 for(let i=0;i<c;i++){
  const t=ts[i];
  if(t.some(x=>x!==t[0])){solved=false;break;}
 }
 if(solved&&c>1){
  // Swap one ball
  const tmp=ts[0][0];
  ts[0][0]=ts[1][0];
  ts[1][0]=tmp;
 }
 return ts;
}

function loadLevel(idx){
 currentLevel=idx;
 const cfg=LEVEL_CONFIGS[idx];
 tubeSize=cfg.b;
 tubes=generateLevel(cfg);
 moveCount=0; hintsLeft=3; selectedTube=-1; history=[];
 document.getElementById('moves').textContent='0';
 document.getElementById('hintsLeft').textContent='3';
 document.getElementById('levelNum').textContent=`${idx+1}/${LEVEL_CONFIGS.length}`;
 document.getElementById('levelDisplay').textContent=`Level ${idx+1}`;
 const bst=bestScores[idx];
 document.getElementById('bestMoves').textContent=bst||'—';
 document.getElementById('winOverlay').classList.remove('show');
 setMsg('Sort all balls into same-colored tubes!');
 renderDots();
 render();
}

function render(){
 const area=document.getElementById('gameArea'); area.innerHTML='';
 const ballH=Math.min(44, Math.floor(180/tubeSize));
 const tubeH=ballH*tubeSize;
 tubes.forEach((tube,ti)=>{
  const isDone=tube.length===tubeSize&&tube.every(b=>b===tube[0]);
  const wrap=document.createElement('div');
  wrap.className='tube-wrap'+(ti===selectedTube?' selected':'')+(isDone?' done-tube':'');
  wrap.onclick=()=>onTubeClick(ti);
  const cap=document.createElement('div'); cap.className='tube-cap'; wrap.appendChild(cap);
  const tubeEl=document.createElement('div');
  tubeEl.className='tube'; tubeEl.style.height=tubeH+'px';
  // Fill from bottom: tube array index 0 = bottom
  for(let i=tube.length-1;i>=0;i--){
   const ball=document.createElement('div');
   ball.className='ball';
   ball.style.height=ballH+'px';
   const col=COLORS[tube[i]];
   ball.style.background=`linear-gradient(135deg,${col.bg},${col.dark})`;
   ball.style.boxShadow=`inset 0 2px 4px rgba(255,255,255,.15)`;
   tubeEl.appendChild(ball);
  }
  wrap.appendChild(tubeEl);
  const lbl=document.createElement('div'); lbl.className='tube-label'; lbl.textContent=`T${ti+1}`; wrap.appendChild(lbl);
  area.appendChild(wrap);
 });
}

function onTubeClick(ti){
 if(selectedTube===-1){
  if(tubes[ti].length===0) return;
  selectedTube=ti; render();
 } else if(selectedTube===ti){
  selectedTube=-1; render();
 } else {
  // Try move
  const from=tubes[selectedTube], to=tubes[ti];
  if(to.length>=tubeSize){setMsg('Tube is full!','error');selectedTube=-1;render();return;}
  if(from.length===0){selectedTube=ti;render();return;}
  const topBall=from[from.length-1];
  if(to.length>0&&to[to.length-1]!==topBall){
   setMsg('Colors must match!','error');
   setTimeout(()=>setMsg(''),1200);
   selectedTube=-1; render(); return;
  }
  // Count how many same-color on top of source
  let count=0;
  for(let i=from.length-1;i>=0;i--){
   if(from[i]===topBall) count++;
   else break;
  }
  // How many fit
  const fit=tubeSize-to.length;
  const move=Math.min(count,fit);
  // Save history
  history.push(tubes.map(t=>[...t]));
  for(let i=0;i<move;i++){ to.push(from.pop()); }
  moveCount++; document.getElementById('moves').textContent=moveCount;
  selectedTube=-1; render();
  checkWin();
 }
}

function checkWin(){
 const cfg=LEVEL_CONFIGS[currentLevel];
 let done=0;
 tubes.forEach(t=>{ if(t.length===tubeSize&&t.every(b=>b===t[0])) done++; });
 if(done===cfg.c){
  completed.add(currentLevel);
  if(!bestScores[currentLevel]||moveCount<bestScores[currentLevel]) bestScores[currentLevel]=moveCount;
  const stars=moveCount<=cfg.c*2?3:moveCount<=cfg.c*3?2:1;
  setTimeout(()=>{
   document.getElementById('winStars').textContent='⭐'.repeat(stars)+'☆'.repeat(3-stars);
   document.getElementById('winStats').textContent=`${moveCount} moves · ${stars} star${stars!==1?'s':''}`;
   document.getElementById('winOverlay').classList.add('show');
  },400);
  renderDots();
 }
}

function undoMove(){
 if(!history.length) return;
 tubes=history.pop().map(t=>[...t]);
 moveCount=Math.max(0,moveCount-1);
 document.getElementById('moves').textContent=moveCount;
 selectedTube=-1; render(); setMsg('');
}

function restartLevel(){ loadLevel(currentLevel); }
function prevLevel(){ if(currentLevel>0) loadLevel(currentLevel-1); }
function nextLevel(){ if(currentLevel<LEVEL_CONFIGS.length-1) loadLevel(currentLevel+1); }
function closeWin(){ document.getElementById('winOverlay').classList.remove('show'); }

function useHint(){
 if(hintsLeft<=0){setMsg('No hints left!','error');return;}
 // Find a valid move: prefer moves that group same-color
 let best=null, bestScore=-1;
 tubes.forEach((from,fi)=>{
  if(!from.length) return;
  const top=from[from.length-1];
  tubes.forEach((to,ti)=>{
   if(ti===fi||to.length>=tubeSize) return;
   if(to.length>0&&to[to.length-1]!==top) return;
   // Score: prefer filling a tube with same color
   let sc=1;
   if(to.length>0) sc=5;
   if(to.length===tubeSize-1) sc=10;
   if(sc>bestScore){bestScore=sc;best={fi,ti};}
  });
 });
 if(best){
  hintsLeft--;
  document.getElementById('hintsLeft').textContent=hintsLeft;
  const wraps=document.querySelectorAll('.tube-wrap');
  wraps[best.fi].classList.add('hint');
  wraps[best.ti].style.boxShadow='0 0 20px rgba(16,185,129,.6)';
  setTimeout(()=>{
   wraps[best.fi].classList.remove('hint');
   wraps[best.ti].style.boxShadow='';
  },1800);
  setMsg(`Hint: move from Tube ${best.fi+1} to Tube ${best.ti+1}`);
 } else {
  setMsg('No obvious hint found. Try undoing!','error');
 }
}

function setMsg(m,type=''){
 const el=document.getElementById('msg');
 el.textContent=m; el.className='msg'+(type?' '+type:'');
}

function renderDots(){
 const el=document.getElementById('levelDots'); el.innerHTML='';
 LEVEL_CONFIGS.forEach((_,i)=>{
  const d=document.createElement('div');
  d.className='level-dot'+(completed.has(i)?' completed':'')+(i===currentLevel?' current':'');
  d.title=`Level ${i+1}`;
  d.onclick=()=>loadLevel(i);
  el.appendChild(d);
 });
}

loadLevel(0);
</script>
</body>
</html>
