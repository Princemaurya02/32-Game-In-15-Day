<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Pinball</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#020408;color:#fff;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px;touch-action:none;overflow:hidden}
h1{font-size:1.6rem;background:linear-gradient(135deg,#f59e0b,#ef4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px;letter-spacing:2px}
.hud{display:flex;gap:12px;margin-bottom:6px;font-size:.85rem;flex-wrap:wrap;justify-content:center}
.stat{background:#060c08;border:1px solid #0f1a10;border-radius:8px;padding:5px 12px;text-align:center;min-width:65px}
.stat-label{font-size:.58rem;color:#6b7280;text-transform:uppercase;letter-spacing:1px}
.stat-val{font-size:1rem;font-weight:700;color:#f59e0b}
canvas{border:1px solid #0f1a10;border-radius:4px;display:block}
.flipper-btns{display:flex;gap:20px;margin-top:10px;justify-content:center}
.flip-btn{background:#0a1a08;border:2px solid #1a3010;color:#4ade80;border-radius:10px;padding:10px 30px;font-size:.9rem;font-weight:700;cursor:pointer;user-select:none;-webkit-user-select:none;transition:background .1s;min-width:100px;text-align:center}
.flip-btn:active,.flip-btn.active{background:#143010;border-color:#4ade80}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:100}
.overlay.show{display:flex}
.ov-box{background:#060c08;border:2px solid #f59e0b;border-radius:16px;padding:30px;text-align:center;animation:pop .4s ease;max-width:260px;width:90%}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.ov-title{font-size:1.6rem;color:#f59e0b;margin-bottom:8px}
.ov-sub{color:#9ca3af;margin-bottom:18px;font-size:.85rem}
.btn{background:linear-gradient(135deg,#78350f,#d97706);border:none;color:#fff;border-radius:8px;padding:9px 22px;cursor:pointer;font-size:.85rem;font-weight:700;transition:all .2s}
.btn:hover{transform:translateY(-2px)}
</style>
</head>
<body>
<h1>🎰 PINBALL</h1>
<div class="hud">
  <div class="stat"><div class="stat-label">Score</div><div class="stat-val" id="score">0</div></div>
  <div class="stat"><div class="stat-label">Best</div><div class="stat-val" id="best">0</div></div>
  <div class="stat"><div class="stat-label">Ball</div><div class="stat-val" id="balls">3</div></div>
  <div class="stat"><div class="stat-label">Mult</div><div class="stat-val" id="mult">x1</div></div>
</div>
<canvas id="c"></canvas>
<div class="flipper-btns">
  <div class="flip-btn" id="leftFlip">◀ LEFT</div>
  <div class="flip-btn" id="rightFlip">RIGHT ▶</div>
</div>
<div class="overlay" id="ov">
  <div class="ov-box">
    <div class="ov-title" id="ovTitle">GAME OVER</div>
    <div class="ov-sub" id="ovSub"></div>
    <button class="btn" onclick="startGame();closeOv()">▶ Play Again</button>
  </div>
</div>
<script>
const C=document.getElementById('c'),ctx=C.getContext('2d');
const W=Math.min(300,window.innerWidth-20),H=Math.min(480,window.innerHeight-200);
C.width=W;C.height=H;
const BR=10,FW=70,FH=12;
let ball,score,best=0,balls,mult,multTimer,raf,launched,lFlip=false,rFlip=false;
let bumpers,targets,lastFire=0;

function makeBumpers(){
  const bs=[];
  const positions=[[W*.25,H*.22],[W*.75,H*.22],[W*.5,H*.32],[W*.2,H*.42],[W*.8,H*.42],[W*.5,H*.52]];
  positions.forEach(([x,y],i)=>bs.push({x,y,r:18,color:['#ef4444','#3b82f6','#22c55e','#f59e0b','#a855f7','#ec4899'][i],pts:50,flash:0}));
  return bs;
}
function makeTargets(){
  return[
    {x:W*.15,y:H*.12,w:20,h:8,pts:100,flash:0,color:'#fde68a'},
    {x:W*.5-10,y:H*.08,w:20,h:8,pts:100,flash:0,color:'#fde68a'},
    {x:W*.85-20,y:H*.12,w:20,h:8,pts:100,flash:0,color:'#fde68a'},
  ];
}

function startGame(){
  score=0;balls=3;mult=1;multTimer=0;launched=false;lFlip=false;rFlip=false;
  ball={x:W-20,y:H-100,vx:0,vy:0,r:BR};
  bumpers=makeBumpers();targets=makeTargets();
  updateHUD();cancelAnimationFrame(raf);loop();
}

function launch(){
  if(launched)return;
  launched=true;ball.vx=-(2+Math.random()*2);ball.vy=-(8+Math.random()*4);
}

function loop(){
  raf=requestAnimationFrame(loop);
  update();draw();
}

function update(){
  if(!launched){ball.x=W-20;ball.y=H-100;return;}
  ball.vy+=0.25;ball.x+=ball.vx;ball.y+=ball.vy;
  // Walls
  if(ball.x<BR){ball.x=BR;ball.vx=Math.abs(ball.vx)*.85;}
  if(ball.x>W-BR){ball.x=W-BR;ball.vx=-Math.abs(ball.vx)*.85;}
  if(ball.y<BR){ball.y=BR;ball.vy=Math.abs(ball.vy)*.85;}
  // Flippers
  const lx=W*.22,ly=H-35,rx=W*.78,ry=H-35;
  const la=lFlip?-0.5:0.4,ra=rFlip?Math.PI+0.5:Math.PI-0.4;
  // Left flipper collision
  if(ball.y>ly-FH-BR&&ball.y<ly+BR&&ball.x>lx-5&&ball.x<lx+FW+5){
    if(ball.vy>0){ball.vy=-(Math.abs(ball.vy)*1.1+1);ball.vx+=(lFlip?-3:2);score+=5*mult;updateHUD();}
  }
  // Right flipper collision
  if(ball.y>ry-FH-BR&&ball.y<ry+BR&&ball.x>rx-FW-5&&ball.x<rx+5){
    if(ball.vy>0){ball.vy=-(Math.abs(ball.vy)*1.1+1);ball.vx+=(rFlip?3:-2);score+=5*mult;updateHUD();}
  }
  // Bumpers
  bumpers.forEach(b=>{
    const dx=ball.x-b.x,dy=ball.y-b.y,dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<b.r+BR){
      const nx=dx/dist,ny=dy/dist;
      const speed=Math.sqrt(ball.vx*ball.vx+ball.vy*ball.vy);
      ball.vx=nx*Math.max(speed,6);ball.vy=ny*Math.max(speed,6);
      ball.x=b.x+nx*(b.r+BR+1);ball.y=b.y+ny*(b.r+BR+1);
      score+=b.pts*mult;b.flash=15;multTimer=120;mult=Math.min(5,mult);
      updateHUD();
    }
    if(b.flash>0)b.flash--;
  });
  // Targets
  targets.forEach(t=>{
    if(ball.x>t.x-BR&&ball.x<t.x+t.w+BR&&ball.y>t.y-BR&&ball.y<t.y+t.h+BR&&ball.vy<0){
      ball.vy*=-1;score+=t.pts*mult;t.flash=20;mult=Math.min(5,mult+1);multTimer=180;updateHUD();
    }
    if(t.flash>0)t.flash--;
  });
  if(multTimer>0){multTimer--;if(multTimer===0){mult=1;updateHUD();}}
  // Lost ball
  if(ball.y>H+BR){
    balls--;updateHUD();launched=false;
    if(balls<=0){cancelAnimationFrame(raf);if(score>best)best=score;document.getElementById('ovTitle').textContent='GAME OVER';document.getElementById('ovSub').textContent=`Final Score: ${score}`;document.getElementById('ov').classList.add('show');}
    else{setTimeout(()=>launch(),500);}
  }
  // Cap speed
  const spd=Math.sqrt(ball.vx*ball.vx+ball.vy*ball.vy);if(spd>14){ball.vx=ball.vx/spd*14;ball.vy=ball.vy/spd*14;}
}

function draw(){
  ctx.fillStyle='#020408';ctx.fillRect(0,0,W,H);
  // Bumpers
  bumpers.forEach(b=>{
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
    ctx.fillStyle=b.flash>0?'#fff':b.color;ctx.shadowColor=b.color;ctx.shadowBlur=b.flash>0?20:8;ctx.fill();
    ctx.shadowBlur=0;ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=2;ctx.stroke();
  });
  // Targets
  targets.forEach(t=>{
    ctx.fillStyle=t.flash>0?'#fff':t.color;ctx.shadowColor=t.color;ctx.shadowBlur=t.flash>0?16:6;
    ctx.beginPath();ctx.roundRect(t.x,t.y,t.w,t.h,3);ctx.fill();ctx.shadowBlur=0;
  });
  // Flippers
  const lx=W*.22,ly=H-35,rx=W*.78,ry=H-35;
  drawFlipper(lx,ly,FW,lFlip?-0.5:0.4,false);
  drawFlipper(rx,ry,FW,rFlip?Math.PI+0.5:Math.PI-0.4,true);
  // Launch lane
  ctx.strokeStyle='#0f1a10';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(W-24,H-60);ctx.lineTo(W-24,H-40);ctx.stroke();
  // Ball
  ctx.beginPath();ctx.arc(ball.x,ball.y,BR,0,Math.PI*2);
  ctx.fillStyle='#e2e8f0';ctx.shadowColor='#fff';ctx.shadowBlur=12;ctx.fill();ctx.shadowBlur=0;
  // Score display on field
  if(multTimer>0){ctx.fillStyle=`rgba(255,220,50,.8)`;ctx.font='bold 1rem Segoe UI';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(`x${mult}`,W/2,H*.7);}
}

function drawFlipper(x,y,len,angle,flip){
  ctx.save();ctx.translate(x,y);
  const g=ctx.createLinearGradient(0,0,Math.cos(angle)*len,Math.sin(angle)*len);
  g.addColorStop(0,'#4ade80');g.addColorStop(1,'#166534');
  ctx.strokeStyle=g;ctx.lineWidth=FH;ctx.lineCap='round';ctx.shadowColor='#4ade80';ctx.shadowBlur=6;
  ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(angle)*len,Math.sin(angle)*len);ctx.stroke();
  ctx.shadowBlur=0;ctx.restore();
}

function updateHUD(){
  document.getElementById('score').textContent=score;
  document.getElementById('best').textContent=Math.max(best,score);
  document.getElementById('balls').textContent=balls;
  document.getElementById('mult').textContent='x'+mult;
}

function closeOv(){document.getElementById('ov').classList.remove('show');}

// Controls
const lf=document.getElementById('leftFlip'),rf=document.getElementById('rightFlip');
lf.addEventListener('touchstart',e=>{lFlip=true;launch();lf.classList.add('active');e.preventDefault();},{passive:false});
lf.addEventListener('touchend',()=>{lFlip=false;lf.classList.remove('active');});
lf.addEventListener('mousedown',()=>{lFlip=true;launch();lf.classList.add('active');});
lf.addEventListener('mouseup',()=>{lFlip=false;lf.classList.remove('active');});
rf.addEventListener('touchstart',e=>{rFlip=true;launch();rf.classList.add('active');e.preventDefault();},{passive:false});
rf.addEventListener('touchend',()=>{rFlip=false;rf.classList.remove('active');});
rf.addEventListener('mousedown',()=>{rFlip=true;launch();rf.classList.add('active');});
rf.addEventListener('mouseup',()=>{rFlip=false;rf.classList.remove('active');});

document.addEventListener('keydown',e=>{
  if(e.key==='z'||e.key==='Z'||e.key==='ArrowLeft'){lFlip=true;launch();}
  if(e.key==='/'||e.key==='ArrowRight'){rFlip=true;launch();}
  if(e.key===' '){launch();e.preventDefault();}
});
document.addEventListener('keyup',e=>{
  if(e.key==='z'||e.key==='Z'||e.key==='ArrowLeft')lFlip=false;
  if(e.key==='/'||e.key==='ArrowRight')rFlip=false;
});

startGame();setTimeout(()=>launch(),800);
</script>
</body>
</html>
