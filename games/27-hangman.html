<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Hangman</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#08060f;color:#fff;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px;touch-action:manipulation}
h1{font-size:1.8rem;background:linear-gradient(135deg,#f472b6,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.hud{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;justify-content:center}
.stat{background:#100c1a;border:1px solid #1e1830;border-radius:10px;padding:6px 14px;text-align:center;min-width:72px}
.stat-label{font-size:.6rem;color:#6b7280;text-transform:uppercase;letter-spacing:1px}
.stat-val{font-size:1.05rem;font-weight:700;color:#f472b6}
.cat-tag{background:#1e1830;border:1px solid #2d1f50;color:#c4b5fd;border-radius:20px;padding:3px 14px;font-size:.75rem;margin-bottom:10px}
.canvas-wrap{background:#100c1a;border:2px solid #1e1830;border-radius:14px;padding:10px;margin-bottom:12px}
canvas{display:block}
.word-display{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
.letter-slot{width:32px;height:40px;border-bottom:3px solid #3d2d6e;display:flex;align-items:flex-end;justify-content:center;font-size:1.3rem;font-weight:800;color:#e2e8f0;padding-bottom:4px;transition:all .3s}
.letter-slot.correct{color:#4ade80;border-color:#4ade80}
.letter-slot.blank{border-color:#2d2050}
.keyboard{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:340px;margin-bottom:12px}
.kb-key{background:#100c1a;border:2px solid #1e1830;color:#e2e8f0;border-radius:8px;width:32px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:.85rem;font-weight:700;transition:all .15s}
.kb-key:hover{background:#1e1830;border-color:#3d2d6e}
.kb-key.correct{background:#052015;border-color:#4ade80;color:#4ade80}
.kb-key.wrong{background:#200515;border-color:#6b21a8;color:#3b1060;cursor:not-allowed}
.hint-area{background:#100c1a;border:1px solid #1e1830;border-radius:10px;padding:10px 16px;max-width:340px;width:100%;text-align:center;margin-bottom:10px;font-size:.85rem;color:#9ca3af;min-height:40px}
.diff-bar{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;justify-content:center}
.diff-btn{background:#100c1a;border:1px solid #1e1830;color:#9ca3af;border-radius:8px;padding:5px 12px;cursor:pointer;font-size:.75rem;transition:all .2s}
.diff-btn.active{background:#200c30;border-color:#8b5cf6;color:#c4b5fd}
.btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.btn{border:none;color:#fff;border-radius:10px;padding:8px 18px;cursor:pointer;font-size:.82rem;font-weight:700;transition:all .2s}
.btn-new{background:linear-gradient(135deg,#581c87,#7e22ce)}
.btn-hint{background:linear-gradient(135deg,#1e3a8a,#2563eb)}
.btn:hover{transform:translateY(-2px)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:100}
.overlay.show{display:flex}
.ov-box{background:#100c1a;border:2px solid #8b5cf6;border-radius:20px;padding:36px;text-align:center;animation:pop .4s ease;max-width:300px;width:90%}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.ov-emoji{font-size:3rem;display:block;margin-bottom:10px}
.ov-title{font-size:1.7rem;color:#a78bfa;margin-bottom:6px}
.ov-word{font-size:1.4rem;font-weight:800;color:#f472b6;margin-bottom:16px;letter-spacing:3px}
.ov-sub{color:#9ca3af;margin-bottom:20px;font-size:.9rem}
</style>
</head>
<body>
<h1>🪢 Hangman</h1>
<div class="hud">
  <div class="stat"><div class="stat-label">Wins</div><div class="stat-val" id="wins">0</div></div>
  <div class="stat"><div class="stat-label">Losses</div><div class="stat-val" id="losses">0</div></div>
  <div class="stat"><div class="stat-label">Wrong</div><div class="stat-val" id="wrongCount">0/6</div></div>
  <div class="stat"><div class="stat-label">Hints</div><div class="stat-val" id="hintsLeft">2</div></div>
</div>
<div class="diff-bar">
  <button class="diff-btn active" onclick="setDiff('easy',this)">Easy</button>
  <button class="diff-btn" onclick="setDiff('medium',this)">Medium</button>
  <button class="diff-btn" onclick="setDiff('hard',this)">Hard</button>
</div>
<div class="cat-tag" id="catTag">🌍 Category</div>
<div class="canvas-wrap"><canvas id="c" width="180" height="160"></canvas></div>
<div class="word-display" id="wordDisplay"></div>
<div class="hint-area" id="hintArea">💡 Press Hint for a clue</div>
<div class="keyboard" id="keyboard"></div>
<div class="btns">
  <button class="btn btn-new" onclick="newGame()">🔄 New Word</button>
  <button class="btn btn-hint" onclick="useHint()">💡 Hint</button>
</div>
<div class="overlay" id="ov">
  <div class="ov-box">
    <span class="ov-emoji" id="ovEmoji">🎉</span>
    <div class="ov-title" id="ovTitle">You Win!</div>
    <div class="ov-word" id="ovWord"></div>
    <div class="ov-sub" id="ovSub"></div>
    <button class="btn btn-new" onclick="newGame();closeOv()">▶ Next Word</button>
  </div>
</div>
<script>
const WORDS={
  easy:[
    {w:'CAT',h:'A furry pet that meows',cat:'🐾 Animals'},
    {w:'DOG',h:'Man\'s best friend',cat:'🐾 Animals'},
    {w:'SUN',h:'Shines in the sky',cat:'🌍 Nature'},
    {w:'BOOK',h:'You read it',cat:'📚 Objects'},
    {w:'FISH',h:'Lives in water',cat:'🐾 Animals'},
    {w:'BIRD',h:'Has wings and feathers',cat:'🐾 Animals'},
    {w:'TREE',h:'Has leaves and roots',cat:'🌍 Nature'},
    {w:'STAR',h:'Shines at night in the sky',cat:'🌍 Nature'},
    {w:'MOON',h:'Earth\'s natural satellite',cat:'🌍 Nature'},
    {w:'RAIN',h:'Falls from clouds',cat:'🌍 Nature'},
  ],
  medium:[
    {w:'GUITAR',h:'Stringed musical instrument',cat:'🎵 Music'},
    {w:'ISLAND',h:'Land surrounded by water',cat:'🌍 Places'},
    {w:'DRAGON',h:'Fire-breathing mythical creature',cat:'✨ Fantasy'},
    {w:'ROCKET',h:'Travels to space',cat:'🚀 Science'},
    {w:'JUNGLE',h:'Dense tropical forest',cat:'🌍 Nature'},
    {w:'PLANET',h:'Orbits a star',cat:'🚀 Science'},
    {w:'CASTLE',h:'Medieval fortress',cat:'🏰 History'},
    {w:'PIRATE',h:'Sails the seas for treasure',cat:'⚓ Adventure'},
    {w:'WIZARD',h:'Casts magical spells',cat:'✨ Fantasy'},
    {w:'MARKET',h:'Where you buy and sell goods',cat:'🏪 Places'},
  ],
  hard:[
    {w:'SYMPHONY',h:'A long orchestral composition',cat:'🎵 Music'},
    {w:'LABYRINTH',h:'A complex maze',cat:'🧩 Puzzle'},
    {w:'AVALANCHE',h:'Mountain snow slide',cat:'🌍 Nature'},
    {w:'TELESCOPE',h:'Used to view distant stars',cat:'🔭 Science'},
    {w:'SUBMARINE',h:'Underwater vessel',cat:'🌊 Transport'},
    {w:'CROCODILE',h:'Large reptile near rivers',cat:'🐾 Animals'},
    {w:'ORCHESTRA',h:'Large musical ensemble',cat:'🎵 Music'},
    {w:'HURRICANE',h:'Powerful tropical storm',cat:'🌍 Nature'},
    {w:'MYTHOLOGY',h:'Ancient stories of gods',cat:'📚 History'},
    {w:'ADVENTURE',h:'An exciting journey',cat:'⚓ Adventure'},
  ]
};

const MAX_WRONG=6;
let word='',hint='',guessed=new Set(),wrongGuesses=0,wins=0,losses=0,hintsLeft=2,diff='easy',gameOver=false;

function setDiff(d,btn){diff=d;document.querySelectorAll('.diff-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');newGame();}

function newGame(){
  const pool=WORDS[diff];
  const entry=pool[Math.floor(Math.random()*pool.length)];
  word=entry.w;hint=entry.h;
  guessed=new Set();wrongGuesses=0;hintsLeft=2;gameOver=false;
  document.getElementById('catTag').textContent=entry.cat;
  document.getElementById('hintsLeft').textContent=2;
  document.getElementById('hintArea').textContent='💡 Press Hint for a clue';
  closeOv();renderAll();
}

function guess(letter){
  if(guessed.has(letter)||gameOver)return;
  guessed.add(letter);
  if(!word.includes(letter))wrongGuesses++;
  document.getElementById('wrongCount').textContent=`${wrongGuesses}/${MAX_WRONG}`;
  renderAll();
  // Check win/lose
  const won=word.split('').every(l=>guessed.has(l));
  const lost=wrongGuesses>=MAX_WRONG;
  if(won){wins++;document.getElementById('wins').textContent=wins;
    setTimeout(()=>{document.getElementById('ovEmoji').textContent='🎉';document.getElementById('ovTitle').textContent='You Win!';document.getElementById('ovWord').textContent=word;document.getElementById('ovSub').textContent=`Solved with ${wrongGuesses} wrong guess${wrongGuesses!==1?'es':''}`;document.getElementById('ov').classList.add('show');},400);gameOver=true;}
  else if(lost){losses++;document.getElementById('losses').textContent=losses;
    setTimeout(()=>{document.getElementById('ovEmoji').textContent='💀';document.getElementById('ovTitle').textContent='Game Over';document.getElementById('ovWord').textContent=word;document.getElementById('ovSub').textContent='Better luck next time!';document.getElementById('ov').classList.add('show');},400);gameOver=true;}
}

function useHint(){
  if(hintsLeft<=0||gameOver)return;
  hintsLeft--;document.getElementById('hintsLeft').textContent=hintsLeft;
  document.getElementById('hintArea').textContent='💡 '+hint;
}

function renderAll(){renderWord();renderKB();drawHangman();}

function renderWord(){
  const el=document.getElementById('wordDisplay');el.innerHTML='';
  word.split('').forEach(l=>{
    const slot=document.createElement('div');slot.className='letter-slot'+(guessed.has(l)?' correct':' blank');
    slot.textContent=guessed.has(l)?l:'';el.appendChild(slot);
  });
}

function renderKB(){
  const el=document.getElementById('keyboard');el.innerHTML='';
  'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(l=>{
    const btn=document.createElement('div');btn.className='kb-key';
    if(guessed.has(l))btn.classList.add(word.includes(l)?'correct':'wrong');
    btn.textContent=l;
    btn.addEventListener('click',()=>guess(l));
    el.appendChild(btn);
  });
}

function drawHangman(){
  const c=document.getElementById('c'),ctx=c.getContext('2d');
  ctx.clearRect(0,0,180,160);
  ctx.strokeStyle='#3d2d6e';ctx.lineWidth=3;ctx.lineCap='round';
  // Gallows
  ctx.beginPath();ctx.moveTo(20,150);ctx.lineTo(160,150);ctx.stroke();
  ctx.beginPath();ctx.moveTo(50,150);ctx.lineTo(50,20);ctx.stroke();
  ctx.beginPath();ctx.moveTo(50,20);ctx.lineTo(110,20);ctx.stroke();
  ctx.beginPath();ctx.moveTo(110,20);ctx.lineTo(110,40);ctx.stroke();
  const bodyColor='#f472b6';ctx.strokeStyle=bodyColor;ctx.lineWidth=3;
  if(wrongGuesses>=1){ctx.beginPath();ctx.arc(110,55,15,0,Math.PI*2);ctx.stroke();}
  if(wrongGuesses>=2){ctx.beginPath();ctx.moveTo(110,70);ctx.lineTo(110,105);ctx.stroke();}
  if(wrongGuesses>=3){ctx.beginPath();ctx.moveTo(110,80);ctx.lineTo(88,95);ctx.stroke();}
  if(wrongGuesses>=4){ctx.beginPath();ctx.moveTo(110,80);ctx.lineTo(132,95);ctx.stroke();}
  if(wrongGuesses>=5){ctx.beginPath();ctx.moveTo(110,105);ctx.lineTo(88,130);ctx.stroke();}
  if(wrongGuesses>=6){ctx.beginPath();ctx.moveTo(110,105);ctx.lineTo(132,130);ctx.stroke();}
}

document.addEventListener('keydown',e=>{if(e.key.length===1&&e.key.match(/[a-zA-Z]/))guess(e.key.toUpperCase());});
function closeOv(){document.getElementById('ov').classList.remove('show');}

newGame();
</script>
</body>
</html>
