<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Trivia Quiz</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#06050f;color:#fff;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:18px;touch-action:manipulation}
h1{font-size:1.8rem;background:linear-gradient(135deg,#818cf8,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:10px}
.hud{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;justify-content:center}
.stat{background:#0d0c1a;border:1px solid #1a1830;border-radius:10px;padding:6px 14px;text-align:center;min-width:72px}
.stat-label{font-size:.6rem;color:#6b7280;text-transform:uppercase;letter-spacing:1px}
.stat-val{font-size:1.05rem;font-weight:700;color:#818cf8}
.cat-select{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:12px;max-width:400px}
.cat-btn{background:#0d0c1a;border:1px solid #1a1830;color:#9ca3af;border-radius:20px;padding:5px 13px;cursor:pointer;font-size:.75rem;transition:all .2s}
.cat-btn.active{border-color:#818cf8;color:#a5b4fc;background:#110f2a}
.timer-bar{width:min(400px,90vw);height:8px;background:#1a1830;border-radius:4px;margin-bottom:14px;overflow:hidden}
.timer-fill{height:100%;background:linear-gradient(90deg,#818cf8,#f472b6);border-radius:4px;transition:width .1s linear}
.q-card{background:#0d0c1a;border:2px solid #1a1830;border-radius:18px;padding:22px 20px;max-width:430px;width:100%;margin-bottom:14px;position:relative}
.q-meta{display:flex;justify-content:space-between;margin-bottom:10px;font-size:.72rem;color:#6b7280}
.q-cat{color:#818cf8;font-weight:600}
.q-diff{padding:2px 8px;border-radius:10px;font-weight:700}
.diff-easy{background:#052015;color:#4ade80}.diff-medium{background:#2a1a00;color:#f59e0b}.diff-hard{background:#200510;color:#f87171}
.q-text{font-size:1rem;font-weight:600;color:#f1f5f9;line-height:1.5;margin-bottom:6px}
.q-num{font-size:.72rem;color:#6b7280;margin-bottom:8px}
.options{display:flex;flex-direction:column;gap:8px;max-width:430px;width:100%}
.opt{background:#0d0c1a;border:2px solid #1a1830;border-radius:12px;padding:13px 16px;cursor:pointer;transition:all .2s;text-align:left;font-size:.9rem;color:#e2e8f0;display:flex;align-items:center;gap:10px}
.opt:hover{border-color:#818cf8;background:#110f2a}
.opt.correct{background:#052015;border-color:#4ade80;color:#4ade80}
.opt.wrong{background:#200510;border-color:#ef4444;color:#f87171}
.opt.reveal{border-color:#4ade80;color:#4ade80;background:#052015}
.opt-letter{width:26px;height:26px;border-radius:50%;border:2px solid currentColor;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.8rem;flex-shrink:0}
.streak-bar{display:flex;gap:4px;justify-content:center;margin-bottom:10px;min-height:14px}
.streak-dot{width:12px;height:12px;border-radius:50%;background:#1a1830;transition:background .3s}
.streak-dot.on{background:#f59e0b;box-shadow:0 0 6px #f59e0b}
.msg{min-height:24px;font-size:.88rem;font-weight:700;text-align:center;margin-bottom:8px;color:#fde68a}
.btn{border:none;color:#fff;border-radius:10px;padding:9px 22px;cursor:pointer;font-size:.85rem;font-weight:700;transition:all .2s;background:linear-gradient(135deg,#312e81,#4338ca)}
.btn:hover{transform:translateY(-2px)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:100}
.overlay.show{display:flex}
.ov-box{background:#0d0c1a;border:2px solid #818cf8;border-radius:20px;padding:34px;text-align:center;animation:pop .4s ease;max-width:310px;width:90%}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.ov-emoji{font-size:3rem;display:block;margin-bottom:10px}
.ov-title{font-size:1.7rem;color:#818cf8;margin-bottom:6px}
.ov-sub{color:#9ca3af;margin-bottom:16px;font-size:.88rem}
.ov-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.ov-stat{background:#110f2a;border-radius:10px;padding:10px}
.ov-val{font-size:1.5rem;font-weight:800;color:#818cf8}
.ov-label{font-size:.6rem;color:#6b7280;text-transform:uppercase}
</style>
</head>
<body>
<h1>🧠 Trivia Quiz</h1>
<div class="hud">
  <div class="stat"><div class="stat-label">Score</div><div class="stat-val" id="score">0</div></div>
  <div class="stat"><div class="stat-label">Best</div><div class="stat-val" id="best">0</div></div>
  <div class="stat"><div class="stat-label">Correct</div><div class="stat-val" id="correct">0/0</div></div>
  <div class="stat"><div class="stat-label">Streak</div><div class="stat-val" id="streak">0</div></div>
</div>
<div class="cat-select" id="catSelect"></div>
<div class="timer-bar"><div class="timer-fill" id="timerFill" style="width:100%"></div></div>
<div class="streak-bar" id="streakBar"></div>
<div class="msg" id="msg"></div>
<div class="q-card" id="qCard">
  <div class="q-meta"><span class="q-cat" id="qCat">🧠 General</span><span class="q-diff diff-medium" id="qDiff">Medium</span></div>
  <div class="q-num" id="qNum">Question 1 of 15</div>
  <div class="q-text" id="qText">Press Start to begin!</div>
</div>
<div class="options" id="options"></div>
<button class="btn" onclick="startGame()" style="margin-top:8px">▶ Start Quiz</button>
<div class="overlay" id="ov">
  <div class="ov-box">
    <span class="ov-emoji" id="ovEmoji">🏆</span>
    <div class="ov-title" id="ovTitle">Quiz Complete!</div>
    <div class="ov-sub" id="ovSub"></div>
    <div class="ov-grid">
      <div class="ov-stat"><div class="ov-val" id="ovScore">0</div><div class="ov-label">Score</div></div>
      <div class="ov-stat"><div class="ov-val" id="ovAcc">0%</div><div class="ov-label">Accuracy</div></div>
      <div class="ov-stat"><div class="ov-val" id="ovStreak">0</div><div class="ov-label">Best Streak</div></div>
      <div class="ov-stat"><div class="ov-val" id="ovGrade">C</div><div class="ov-label">Grade</div></div>
    </div>
    <button class="btn" onclick="startGame();closeOv()">▶ Play Again</button>
  </div>
</div>
<script>
const QUESTIONS=[
  // Science
  {q:"What is the chemical symbol for Gold?",opts:["Au","Go","Gd","Ag"],ans:0,cat:"⚗️ Science",diff:"easy"},
  {q:"How many planets are in our Solar System?",opts:["7","8","9","10"],ans:1,cat:"🔭 Science",diff:"easy"},
  {q:"What gas do plants absorb from the atmosphere?",opts:["Oxygen","Hydrogen","Carbon Dioxide","Nitrogen"],ans:2,cat:"🌿 Science",diff:"easy"},
  {q:"What is the speed of light (approx)?",opts:["300,000 km/s","150,000 km/s","500,000 km/s","1,000,000 km/s"],ans:0,cat:"⚗️ Science",diff:"medium"},
  {q:"DNA stands for?",opts:["Deoxyribonucleic Acid","Diribonucleic Acid","Dynamic Nucleic Acid","Dense Nucleic Acid"],ans:0,cat:"🔬 Science",diff:"medium"},
  {q:"What is the powerhouse of the cell?",opts:["Nucleus","Ribosome","Mitochondria","Golgi Body"],ans:2,cat:"🔬 Science",diff:"easy"},
  {q:"Which element has atomic number 1?",opts:["Helium","Oxygen","Hydrogen","Carbon"],ans:2,cat:"⚗️ Science",diff:"easy"},
  {q:"What is the hardest natural substance?",opts:["Gold","Diamond","Iron","Quartz"],ans:1,cat:"⚗️ Science",diff:"easy"},
  // History
  {q:"Who painted the Mona Lisa?",opts:["Michelangelo","Raphael","Leonardo da Vinci","Picasso"],ans:2,cat:"🎨 Art",diff:"easy"},
  {q:"In which year did World War II end?",opts:["1943","1944","1945","1946"],ans:2,cat:"📜 History",diff:"easy"},
  {q:"Who was the first man to walk on the Moon?",opts:["Buzz Aldrin","Yuri Gagarin","Neil Armstrong","John Glenn"],ans:2,cat:"🚀 History",diff:"easy"},
  {q:"Which ancient wonder was located in Alexandria?",opts:["Colosseum","Lighthouse","Parthenon","Pyramid"],ans:1,cat:"📜 History",diff:"medium"},
  {q:"The Great Wall of China was primarily built to defend against?",opts:["Mongol invasions","Japanese attacks","Persian armies","Roman legions"],ans:0,cat:"📜 History",diff:"medium"},
  // Geography
  {q:"What is the capital of Australia?",opts:["Sydney","Melbourne","Canberra","Brisbane"],ans:2,cat:"🌍 Geography",diff:"medium"},
  {q:"Which is the world's longest river?",opts:["Amazon","Congo","Nile","Mississippi"],ans:2,cat:"🌍 Geography",diff:"easy"},
  {q:"What is the smallest country in the world?",opts:["Monaco","Liechtenstein","Vatican City","San Marino"],ans:2,cat:"🌍 Geography",diff:"medium"},
  {q:"Which continent is the Sahara Desert on?",opts:["Asia","South America","Africa","Australia"],ans:2,cat:"🌍 Geography",diff:"easy"},
  {q:"Mount Everest is in which mountain range?",opts:["Andes","Alps","Rockies","Himalayas"],ans:3,cat:"🏔️ Geography",diff:"easy"},
  // Pop Culture
  {q:"How many strings does a standard guitar have?",opts:["4","5","6","7"],ans:2,cat:"🎵 Music",diff:"easy"},
  {q:"Which sport uses a shuttlecock?",opts:["Tennis","Badminton","Squash","Pickleball"],ans:1,cat:"⚽ Sports",diff:"easy"},
  {q:"How many players on a basketball team on court?",opts:["4","5","6","7"],ans:1,cat:"⚽ Sports",diff:"easy"},
  {q:"What is the highest possible score in ten-pin bowling?",opts:["200","250","300","350"],ans:2,cat:"⚽ Sports",diff:"medium"},
  // Math
  {q:"What is the square root of 144?",opts:["11","12","13","14"],ans:1,cat:"🔢 Math",diff:"easy"},
  {q:"How many sides does a hexagon have?",opts:["5","6","7","8"],ans:1,cat:"🔢 Math",diff:"easy"},
  {q:"What is 15% of 200?",opts:["25","30","35","40"],ans:1,cat:"🔢 Math",diff:"medium"},
  {q:"What is Pi rounded to 2 decimal places?",opts:["3.12","3.14","3.16","3.18"],ans:1,cat:"🔢 Math",diff:"easy"},
  // Nature
  {q:"How many legs does a spider have?",opts:["6","8","10","12"],ans:1,cat:"🦁 Nature",diff:"easy"},
  {q:"What is the largest mammal in the world?",opts:["Elephant","Blue Whale","Giraffe","Hippopotamus"],ans:1,cat:"🦁 Nature",diff:"easy"},
  {q:"Which bird cannot fly?",opts:["Eagle","Parrot","Penguin","Sparrow"],ans:2,cat:"🦁 Nature",diff:"easy"},
  {q:"How many hearts does an octopus have?",opts:["1","2","3","4"],ans:2,cat:"🦑 Nature",diff:"hard"},
];

const CATS=['All','⚗️ Science','📜 History','🌍 Geography','🎵 Music','⚽ Sports','🔢 Math','🦁 Nature'];
const TOTAL=15,TIME=20;
let questions,qIdx,score,best=0,correct,answered,streak,maxStreak,timer,timeLeft,selectedCat='All';

function buildCatSelect(){
  const el=document.getElementById('catSelect');el.innerHTML='';
  CATS.forEach(c=>{
    const btn=document.createElement('button');btn.className='cat-btn'+(c===selectedCat?' active':'');
    btn.textContent=c;btn.onclick=()=>{selectedCat=c;buildCatSelect();};
    el.appendChild(btn);
  });
}

function startGame(){
  let pool=selectedCat==='All'?QUESTIONS:QUESTIONS.filter(q=>q.cat.includes(selectedCat.replace(/^[^\s]*\s/,'')));
  if(pool.length<TOTAL)pool=[...pool,...pool,...pool];
  questions=shuffle([...pool]).slice(0,TOTAL);
  qIdx=0;score=0;correct=0;answered=0;streak=0;maxStreak=0;
  closeOv();nextQ();
}

function nextQ(){
  if(qIdx>=TOTAL){endGame();return;}
  const q=questions[qIdx];
  document.getElementById('qNum').textContent=`Question ${qIdx+1} of ${TOTAL}`;
  document.getElementById('qText').textContent=q.q;
  document.getElementById('qCat').textContent=q.cat;
  document.getElementById('qDiff').textContent=q.diff.charAt(0).toUpperCase()+q.diff.slice(1);
  document.getElementById('qDiff').className='q-diff diff-'+q.diff;
  setMsg('');renderStreak();
  const opts=document.getElementById('options');opts.innerHTML='';
  q.opts.forEach((o,i)=>{
    const el=document.createElement('div');el.className='opt';
    el.innerHTML=`<div class="opt-letter">${'ABCD'[i]}</div>${o}`;
    el.addEventListener('click',()=>answer(i,q));
    opts.appendChild(el);
  });
  timeLeft=TIME;document.getElementById('timerFill').style.width='100%';document.getElementById('timerFill').style.background='linear-gradient(90deg,#818cf8,#f472b6)';
  clearInterval(timer);
  timer=setInterval(()=>{
    timeLeft-=.1;const pct=timeLeft/TIME*100;
    document.getElementById('timerFill').style.width=pct+'%';
    if(pct<30)document.getElementById('timerFill').style.background='linear-gradient(90deg,#ef4444,#f97316)';
    if(timeLeft<=0){clearInterval(timer);timeUp(q);}
  },100);
}

function answer(i,q){
  clearInterval(timer);answered++;
  const opts=document.querySelectorAll('.opt');
  const isCorrect=i===q.ans;
  if(isCorrect){correct++;streak++;maxStreak=Math.max(maxStreak,streak);const pts=q.diff==='easy'?10:q.diff==='medium'?20:30;const bonus=Math.round(timeLeft*2);score+=pts+bonus;opts[i].classList.add('correct');setMsg(`✅ Correct! +${pts+bonus}pts`);}
  else{streak=0;opts[i].classList.add('wrong');opts[q.ans].classList.add('reveal');setMsg(`❌ Wrong! Answer: ${q.opts[q.ans]}`);}
  if(score>best)best=score;
  updateHUD();setTimeout(()=>{qIdx++;nextQ();},1300);
}

function timeUp(q){
  answered++;streak=0;
  document.querySelectorAll('.opt')[q.ans].classList.add('reveal');
  setMsg(`⏰ Time's up! Answer: ${q.opts[q.ans]}`);
  updateHUD();setTimeout(()=>{qIdx++;nextQ();},1300);
}

function endGame(){
  clearInterval(timer);if(score>best)best=score;
  const acc=answered?Math.round(correct/answered*100):0;
  const grade=acc>=90?'S':acc>=80?'A':acc>=70?'B':acc>=60?'C':acc>=50?'D':'F';
  document.getElementById('ovEmoji').textContent=acc>=80?'🏆':acc>=60?'🎉':acc>=40?'👍':'📚';
  document.getElementById('ovTitle').textContent=acc>=80?'Excellent!':acc>=60?'Well Done!':'Keep Learning!';
  document.getElementById('ovSub').textContent=`${correct}/${TOTAL} correct`;
  document.getElementById('ovScore').textContent=score;
  document.getElementById('ovAcc').textContent=acc+'%';
  document.getElementById('ovStreak').textContent=maxStreak;
  document.getElementById('ovGrade').textContent=grade;
  document.getElementById('ov').classList.add('show');
}

function renderStreak(){
  const el=document.getElementById('streakBar');el.innerHTML='';
  for(let i=0;i<10;i++){const d=document.createElement('div');d.className='streak-dot'+(i<streak?' on':'');el.appendChild(d);}
}
function updateHUD(){document.getElementById('score').textContent=score;document.getElementById('best').textContent=best;document.getElementById('correct').textContent=`${correct}/${answered}`;document.getElementById('streak').textContent=streak;}
function setMsg(m){document.getElementById('msg').textContent=m;}
function closeOv(){document.getElementById('ov').classList.remove('show');}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

buildCatSelect();
</script>
</body>
</html>
