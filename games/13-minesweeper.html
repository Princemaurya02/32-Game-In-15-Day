<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Minesweeper</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080808;color:#fff;font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px;user-select:none}
h1{font-size:1.7rem;background:linear-gradient(135deg,#6366f1,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.hud{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;justify-content:center}
.stat{background:#111;border:1px solid #222;border-radius:10px;padding:6px 14px;text-align:center;min-width:72px}
.stat-label{font-size:.6rem;color:#6b7280;text-transform:uppercase;letter-spacing:1px}
.stat-val{font-size:1.05rem;font-weight:700;color:#a78bfa}
.diff-bar{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;justify-content:center}
.diff-btn{background:#111;border:1px solid #222;color:#9ca3af;border-radius:8px;padding:5px 12px;cursor:pointer;font-size:.75rem;transition:all .2s}
.diff-btn.active{background:#3730a3;border-color:#6366f1;color:#c7d2fe}
.board{display:grid;gap:3px;background:#111;padding:8px;border-radius:12px;border:2px solid #222;overflow:auto;max-width:95vw}
.cell{display:flex;align-items:center;justify-content:center;border-radius:6px;cursor:pointer;font-weight:700;font-size:.85rem;transition:all .1s;aspect-ratio:1;flex-shrink:0}
.cell.hidden{background:linear-gradient(135deg,#1e1e2e,#2d2d4e);border:1px solid #3d3d6e}
.cell.hidden:hover{background:#2d2d5e;transform:scale(1.08)}
.cell.flagged{background:linear-gradient(135deg,#1e1e2e,#2d2d4e);border:1px solid #3d3d6e;font-size:1rem}
.cell.revealed{background:#0d0d1a;border:1px solid #1a1a2e;cursor:default}
.cell.mine-hit{background:linear-gradient(135deg,#7f1d1d,#991b1b)!important}
.cell.mine-reveal{background:#1a0a0a;border:1px solid #3f1515}
.n1{color:#60a5fa}.n2{color:#4ade80}.n3{color:#f87171}.n4{color:#c084fc}
.n5{color:#f97316}.n6{color:#06b6d4}.n7{color:#f472b6}.n8{color:#fbbf24}
.btn{background:linear-gradient(135deg,#3730a3,#4f46e5);border:none;color:#fff;border-radius:10px;padding:9px 22px;cursor:pointer;font-size:.85rem;font-weight:700;transition:all .2s;margin-top:10px}
.btn:hover{transform:translateY(-2px)}
.msg{min-height:24px;font-size:.82rem;color:#6b7280;margin:6px 0;text-align:center}
.hint{font-size:.72rem;color:#4b5563;text-align:center;margin-bottom:6px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:100}
.overlay.show{display:flex}
.ov-box{background:#111;border:2px solid #6366f1;border-radius:20px;padding:36px;text-align:center;animation:pop .4s ease;max-width:280px;width:90%}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.ov-emoji{font-size:3rem;display:block;margin-bottom:10px}
.ov-title{font-size:1.7rem;color:#a78bfa;margin-bottom:6px}
.ov-sub{color:#9ca3af;margin-bottom:20px;font-size:.9rem}
</style>
</head>
<body>
<h1>💣 Minesweeper</h1>
<div class="hud">
  <div class="stat"><div class="stat-label">Mines</div><div class="stat-val" id="minesLeft">0</div></div>
  <div class="stat"><div class="stat-label">Time</div><div class="stat-val" id="timer">0:00</div></div>
  <div class="stat"><div class="stat-label">Best</div><div class="stat-val" id="best">—</div></div>
</div>
<div class="diff-bar">
  <button class="diff-btn active" onclick="init(9,9,10,this)">Easy 9×9</button>
  <button class="diff-btn" onclick="init(16,16,40,this)">Med 16×16</button>
  <button class="diff-btn" onclick="init(16,30,99,this)">Hard 16×30</button>
</div>
<div class="hint">Left-click reveal · Right-click/Long-press flag 🚩</div>
<div class="msg" id="msg">Click any cell to start!</div>
<div class="board" id="board"></div>
<button class="btn" onclick="init(rows,cols,totalMines)">🔄 New Game</button>
<div class="overlay" id="ov">
  <div class="ov-box">
    <span class="ov-emoji" id="ovEmoji">💥</span>
    <div class="ov-title" id="ovTitle">Boom!</div>
    <div class="ov-sub" id="ovSub"></div>
    <button class="btn" onclick="init(rows,cols,totalMines);closeOv()">▶ Play Again</button>
  </div>
</div>
<script>
let rows=9,cols=9,totalMines=10;
let cells,mines,revealed,flagged,started,timer,seconds,bests={};
let longPressTimer=null;

function init(r,c,m,btn){
  rows=r;cols=c;totalMines=m;
  if(btn){document.querySelectorAll('.diff-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');}
  cells=Array.from({length:r},()=>Array(c).fill(0));
  mines=new Set();revealed=new Set();flagged=new Set();started=false;seconds=0;
  clearInterval(timer);
  document.getElementById('timer').textContent='0:00';
  document.getElementById('minesLeft').textContent=m;
  document.getElementById('msg').textContent='Click any cell to start!';
  closeOv();renderBoard();
}

function placeMines(sr,sc){
  while(mines.size<totalMines){
    const r=Math.floor(Math.random()*rows),c=Math.floor(Math.random()*cols);
    const key=r*cols+c;
    if(Math.abs(r-sr)<=1&&Math.abs(c-sc)<=1)continue;
    mines.add(key);
  }
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    if(mines.has(r*cols+c))continue;
    let cnt=0;
    for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
      if(r+dr>=0&&r+dr<rows&&c+dc>=0&&c+dc<cols&&mines.has((r+dr)*cols+c+dc))cnt++;
    }
    cells[r][c]=cnt;
  }
}

function reveal(r,c){
  const key=r*cols+c;
  if(revealed.has(key)||flagged.has(key))return;
  revealed.add(key);
  if(mines.has(key)){
    // Boom
    clearInterval(timer);started=false;
    mines.forEach(k=>{
      const rr=Math.floor(k/cols),cc=k%cols;
      const el=getEl(rr,cc);
      el.className='cell mine-reveal';el.textContent='💣';
    });
    getEl(r,c).className='cell mine-hit';getEl(r,c).textContent='💥';
    setTimeout(()=>showOv('💥','BOOM!',`Uncovered at ${rows-r},${c+1}`),400);
    return;
  }
  if(cells[r][c]===0){
    for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
      if(r+dr>=0&&r+dr<rows&&c+dc>=0&&c+dc<cols)reveal(r+dr,c+dc);
    }
  }
  const el=getEl(r,c);
  el.className='cell revealed'+(cells[r][c]?' n'+cells[r][c]:'');
  el.textContent=cells[r][c]||'';
  // Check win
  if(revealed.size===rows*cols-totalMines){
    clearInterval(timer);
    const key=`${rows}x${cols}`;
    if(!bests[key]||seconds<bests[key])bests[key]=seconds;
    document.getElementById('best').textContent=bests[key]?formatT(bests[key]):'—';
    showOv('🎉','You Win!',`Cleared in ${formatT(seconds)}`);
  }
}

function toggleFlag(r,c){
  const key=r*cols+c;
  if(revealed.has(key))return;
  if(flagged.has(key)){flagged.delete(key);getEl(r,c).className='cell hidden';getEl(r,c).textContent='';}
  else{flagged.add(key);getEl(r,c).className='cell flagged';getEl(r,c).textContent='🚩';}
  document.getElementById('minesLeft').textContent=totalMines-flagged.size;
}

function getEl(r,c){return document.getElementById('board').children[r*cols+c];}
function formatT(s){return `${Math.floor(s/60)}:${(s%60).toString().padStart(2,'0')}`;}

function renderBoard(){
  const bEl=document.getElementById('board');
  const cellSz=Math.min(34,Math.floor((Math.min(window.innerWidth-50,520))/cols));
  bEl.style.gridTemplateColumns=`repeat(${cols},${cellSz}px)`;
  bEl.innerHTML='';
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const el=document.createElement('div');
    el.className='cell hidden';
    el.style.width=el.style.height=cellSz+'px';
    el.style.fontSize=Math.max(10,cellSz-10)+'px';
    const rr=r,cc=c;
    el.addEventListener('click',()=>{
      if(!started){
        started=true;
        placeMines(rr,cc);
        timer=setInterval(()=>{seconds++;document.getElementById('timer').textContent=formatT(seconds);},1000);
      }
      reveal(rr,cc);
    });
    el.addEventListener('contextmenu',e=>{e.preventDefault();toggleFlag(rr,cc);});
    el.addEventListener('touchstart',e=>{longPressTimer=setTimeout(()=>{toggleFlag(rr,cc);longPressTimer=null;},500);e.preventDefault();},{passive:false});
    el.addEventListener('touchend',e=>{if(longPressTimer){clearTimeout(longPressTimer);longPressTimer=null;}e.preventDefault();},{passive:false});
    el.addEventListener('touchmove',()=>{if(longPressTimer){clearTimeout(longPressTimer);longPressTimer=null;}});
    bEl.appendChild(el);
  }
}

function showOv(emoji,title,sub){
  document.getElementById('ovEmoji').textContent=emoji;
  document.getElementById('ovTitle').textContent=title;
  document.getElementById('ovSub').textContent=sub;
  document.getElementById('ov').classList.add('show');
}
function closeOv(){document.getElementById('ov').classList.remove('show');}

init(9,9,10);
</script>
</body>
</html>
